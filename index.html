<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forest RPG</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div id="loadingScreen">

        <h1>🌲 Forest RPG 🌲</h1>

        <p>Loading...</p>

    </div>


    <!-- Character Creation -->
    <div id="startScreen" class="screen hidden">

        <h1>Forest RPG</h1>

        <h2>Create Your Character</h2>

        <input
            type="text"
            id="playerName"
            placeholder="Enter Your Name"
            maxlength="20"
        >

        <br><br>

        <button id="startGameButton">
            Start Game
        </button>

    </div>


   <!-- Home Screen -->
<div id="homeScreen" class="screen hidden">

    <!-- Player HUD -->
    <div id="playerHUD">

        <div id="playerInfo">

            <div id="displayName">
                Player
            </div>

            <div>
                ⭐ Level <span id="playerLevel">1</span>
            </div>

            <div>
                ⭐ XP <span id="playerXP">0</span>
            </div>

            <div>
                💰 Gold <span id="playerGold">100</span>
            </div>

            <div>
                ❤️ <span id="playerHealth">100</span> HP
            </div>

        </div>

    </div>


    <!-- Welcome Message -->
    <div id="welcomeMessage">
        Welcome!
    </div>


    <!-- Camp Menu -->
    <div id="campButtons">

        <button id="battleButton">
            ⚔️ Battle Arena
        </button>

        <button id="blacksmithButton">
            ⚒️ Blacksmith
        </button>

        <button id="inventoryButton">
            🎒 Inventory
        </button>

        <button id="characterButton">
            📊 Character
        </button>

        <button id="servantsButton">
            👥 Servants
        </button>

    </div>

</div>


    <!-- JavaScript -->

    <script src="game.js"></script>

</body>

</html>
